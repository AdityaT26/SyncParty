<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SyncParty peer connection</title>
</head>
<body>
  <!--
    Hidden extension-origin iframe injected into the watch tab.
    The WebRTC/PeerJS connection lives here because:
    - extension pages are exempt from the host page's CSP (Netflix etc. could
      otherwise block the wss:// signaling socket from a content script), and
    - MV3 service workers are ephemeral and would drop the connection.
    The frame lives exactly as long as the tab, which is what we want.
  -->
  <script src="../vendor/peerjs.min.js"></script>
  <script src="../turn-config.js"></script>
  <script src="peer-frame.js"></script>
</body>
</html>
